---
- name: Update system packages (OS Hardening)
  apt:
    update_cache: yes
    upgrade: dist

- name: Install Docker and required packages
  apt:
    name: 
      - docker.io
      - apt-transport-https
      - curl
    state: present

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
